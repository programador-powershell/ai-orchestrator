services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      GATEWAY_BIND: 0.0.0.0:8787
      DATABASE_URL: postgres://aibot:${POSTGRES_PASSWORD:-aibot}@postgres:5432/aibot
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      PROVIDER_MASTER_KEY: ${PROVIDER_MASTER_KEY}
      RUST_LOG: ${RUST_LOG:-ai_bot_gateway=info,tower_http=info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aibot
      POSTGRES_USER: aibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aibot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibot -d aibot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
