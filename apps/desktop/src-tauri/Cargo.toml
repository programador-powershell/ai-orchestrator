[package]
name = "ai-orchestrator-desktop"
version = "0.1.0"
description = "AI Orchestrator desktop client"
authors = ["AI Orchestrator"]
edition = "2021"

[lib]
name = "ai_orchestrator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Edicao gerenciada: compila FORA os caminhos diretos ao provedor e o
# runtime local — a politica do servidor passa a ser a unica rota de modelo.
managed = []

[dependencies]
base64 = "0.22"
chrono = "0.4"
dirs = "6"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["process", "sync", "time", "fs", "io-util"] }
# Leitura de DOCX/XLSX/PPTX (OOXML = ZIP de XML). Só o reader, sem compressão
# extra, para manter a superfície mínima.
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
