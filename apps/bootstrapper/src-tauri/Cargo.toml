[package]
name = "ai-bot-bootstrapper"
version = "0.1.0"
description = "Small signed installer for AI-BOT"
authors = ["AI-BOT"]
edition = "2021"

[build-dependencies]
hex = "0.4"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
ed25519-dalek = "2"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time"] }
semver = "1"
